# Production stack: PostgreSQL + pgvector, API, web app, Caddy (HTTPS), optional ClamAV and backups.
#   cp infra/prod/.env.example .env   # fill in secrets and DOMAIN
#   docker compose -f compose.prod.yml up -d --build
# See docs/DEPLOYMENT.md.
name: edubooks
x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgres://edubooks_app:${DB_APP_PASSWORD}@db:5432/edubooks
  DATABASE_OWNER_URL: postgres://edubooks:${DB_OWNER_PASSWORD}@db:5432/edubooks
  FILE_URL_SECRET: ${FILE_URL_SECRET}
  COOKIE_SECURE: "1"
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_DIR: /data/storage
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-300}
  CLAMAV_HOST: ${CLAMAV_HOST:-}
  REQUIRE_MALWARE_SCAN: ${REQUIRE_MALWARE_SCAN:-0}
  AI_PROVIDER: ${AI_PROVIDER:-offline}
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_MODEL: ${AI_MODEL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_EMBED_MODEL: ${AI_EMBED_MODEL:-}
  AI_MONTHLY_REQUESTS_PER_SCHOOL: ${AI_MONTHLY_REQUESTS_PER_SCHOOL:-1000}
  SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-720}

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/prod/init-db.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edubooks"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb

  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: edubooks-api:${TAG:-latest}
    environment: *api-env
    command: ["node", "dist/db/migrate.js"]
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  api:
    image: edubooks-api:${TAG:-latest}
    restart: unless-stopped
    environment: *api-env
    volumes: ["storage:/data/storage"]
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { API_URL: "http://api:4000", COOKIE_SECURE: "1" }
    image: edubooks-web:${TAG:-latest}
    restart: unless-stopped
    depends_on: [api]

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. lms.example.com}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-300}
    volumes:
      - ./infra/prod/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]

  clamav:
    profiles: ["clamav"]
    image: clamav/clamav:1.4
    restart: unless-stopped

  # On-demand backups:  docker compose -f compose.prod.yml run --rm backup
  backup:
    profiles: ["tools"]
    image: pgvector/pgvector:pg16
    environment:
      DATABASE_OWNER_URL: postgres://edubooks:${DB_OWNER_PASSWORD}@db:5432/edubooks
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_DIR: /data/storage
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - storage:/data/storage:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - ./infra/backup:/scripts:ro
    entrypoint: ["bash", "/scripts/backup.sh"]
    depends_on: { db: { condition: service_healthy } }

volumes: { pgdata: {}, storage: {}, caddy_data: {}, caddy_config: {} }
