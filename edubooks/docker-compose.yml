# Local infrastructure: PostgreSQL 16 + pgvector, MinIO (S3-compatible private storage), ClamAV (malware scanning).
services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_PASSWORD: postgres }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./infra/bootstrap.sql:/docker-entrypoint-initdb.d/01-bootstrap.sql:ro"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: edubooks, MINIO_ROOT_PASSWORD: edubooks-dev-secret }
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]
  clamav:
    image: clamav/clamav:1.4
    ports: ["3310:3310"]
volumes: { pgdata: {}, minio: {} }
